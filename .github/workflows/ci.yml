name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts skips Electron's binary download; the test suite
      # is static/unit tests and does not need it.
      - run: npm ci --ignore-scripts
      - run: npm test
